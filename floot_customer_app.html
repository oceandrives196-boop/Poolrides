<style>

.route{display:flex;gap:10px;align-items:flex-start;margin-bottom:2px}.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}.dot.green{background:#10B981}.dot.purple{background:#7C3AED}
.addr{font-weight:700;font-size:13px;color:#1F2937;line-height:1.3;flex:1}
.sub{font-size:11px;color:#6B7280;margin:6px 0 10px 20px;line-height:1.4}
.otp-row{display:flex;gap:10px;margin:10px 0}
.otp-box{flex:1;background:#1F1A2E;color:#fff;border-radius:14px;padding:12px;text-align:center;border:2px solid #7C3AED}
.otp-box .lbl{font-size:10px;letter-spacing:.08em;opacity:.8;font-weight:800;color:#A78BFA}
.otp-box .val{font-weight:900;font-size:28px;margin-top:4px;letter-spacing:.15em}
.collect-box{flex:1;background:#FEF3C7;border-radius:14px;padding:12px;text-align:center;border:1px solid #FDE68A}
.collect-box .lbl{font-size:10px;letter-spacing:.08em;color:#92400E;font-weight:800}
.collect-box .val{font-weight:900;font-size:18px;color:#78350F;margin-top:2px}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{border:none;border-radius:999px;padding:11px 14px;font-weight:800;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex:1}
.btn-join{background:#10B981;color:#fff;box-shadow:0 6px 16px rgba(16,185,129,.25)}
.btn-call{background:#F5F3FF;color:#7C3AED}
.btn-cancel{background:#FFF1F2;color:#BE123C}
.btn-search{background:#10B981;color:#fff}
.input-group{position:relative;margin-bottom:12px}.input{width:100%;background:#F8F7FF;border:1.5px solid #EDE9FE;border-radius:16px;padding:16px 16px 16px 48px;font-weight:700;outline:none}.input:focus{border-color:#10B981;background:#fff}
.icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:8px;display:grid;place-items:center}

.auth-bg{position:fixed;inset:0;z-index:10000;background:#fff;display:flex;flex-direction:column;min-height:100dvh}
.auth-top{height:40dvh;background:linear-gradient(180deg,#10B981 0%, #065F46 100%);border-radius:0 0 32px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.auth-card{flex:1;background:#fff;margin-top:-24px;border-radius:32px 32px 0 0;padding:24px 20px;overflow:auto}
.label{font-size:10px;font-weight:800;color:#888;letter-spacing:.08em;text-transform:uppercase;margin:10px 0 6px}
.pool-card{background:#fff;border:1px solid #BBF7D0;border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer}
.pool-card:hover{border-color:#10B981;box-shadow:0 4px 16px rgba(16,185,129,.15)}
</style></head><body>
<div id="notif" class="notif"><span id="nText"></span></div>

<div id="authScreen" class="auth-bg"><div class="auth-top"><div style="width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:28px"><i class="fa-solid fa-user"></i></div><div style="font-weight:900;font-size:24px;margin-top:14px">FLOOT CUSTOMER</div><div style="font-size:13px;opacity:.85">Find Pool Rides • OTP on Your App Only</div></div>
<div class="auth-card"><div style="display:flex;background:#F0FDF4;border-radius:14px;padding:4px;margin-bottom:18px"><button id="loginTab" style="flex:1;padding:12px;border-radius:10px;border:none;background:#fff;color:#10B981;font-weight:800">Login</button><button id="regTab" style="flex:1;padding:12px;border-radius:10px;border:none;background:transparent;color:#6B7280;font-weight:800">Register</button></div>
<div id="loginForm"><div class="input-group"><div class="icon" style="background:#F0FDF4;color:#10B981"><i class="fa-solid fa-envelope"></i></div><input id="loginEmail" class="input" placeholder="Email"></div><div class="input-group"><div class="icon" style="background:#F0FDF4;color:#10B981"><i class="fa-solid fa-lock"></i></div><input id="loginPass" class="input" type="password" placeholder="Password"></div><button id="loginBtn" class="btn btn-join" style="width:100%;border-radius:16px">Continue</button><div id="loginMsg" style="font-size:11px;color:#666;text-align:center;margin-top:8px"></div></div>
<div id="regForm" style="display:none"><div class="input-group"><div class="icon" style="background:#ECFDF5;color:#10B981"><i class="fa-solid fa-user"></i></div><input id="regName" class="input" placeholder="Full name"></div><div class="input-group"><div class="icon" style="background:#F0FDF4;color:#10B981"><i class="fa-solid fa-phone"></i></div><input id="regPhone" class="input" placeholder="Phone"></div><div class="input-group"><div class="icon" style="background:#F0FDF4;color:#10B981"><i class="fa-solid fa-envelope"></i></div><input id="regEmail" class="input" placeholder="Email"></div><div class="input-group"><div class="icon" style="background:#F0FDF4;color:#10B981"><i class="fa-solid fa-lock"></i></div><input id="regPass" class="input" type="password" placeholder="Password"></div><button id="regBtn" class="btn btn-join" style="width:100%;border-radius:16px">Create customer account</button><div id="regMsg" style="font-size:11px;color:#666;text-align:center;margin-top:8px"></div></div></div></div>

<div class="app" id="mainApp" style="display:none"><div id="map"></div>
<div class="header"><div class="profile"><div class="avatar" id="avatar">C</div><div><div style="font-weight:900;font-size:13px" id="custName">Customer</div><div style="font-size:11px;color:#6B7280" id="custEmail">customer • Rider</div></div></div><button class="logout" id="logoutBtn"><i class="fa-solid fa-arrow-right-from-bracket"></i></button></div>
<div class="sheet"><div class="handle"></div>
<div class="tabs"><button id="tSearch" class="tab active"><i class="fa-solid fa-magnifying-glass"></i> Search</button><button id="tRides" class="tab"><i class="fa-solid fa-ticket"></i> My Rides <span class="count" id="cRides">0</span></button></div>
<div class="content">
<div id="searchSec">
<div class="label">Where to? • Dropdown ONLY • Nigeria wide</div>
<div style="position:relative"><div class="input-group"><div class="icon" style="background:#ECFDF5;color:#10B981"><i class="fa-solid fa-circle"></i></div><input id="fromI" class="input" placeholder="Pickup - e.g. Ketu, Lagos - select from dropdown"></div><div id="fromS" class="sug"></div></div>
<div style="position:relative"><div class="input-group"><div class="icon" style="background:#FEF2F2;color:#EF4444"><i class="fa-solid fa-location-dot"></i></div><input id="toI" class="input" placeholder="Destination - e.g. Onitsha - select from dropdown"></div><div id="toS" class="sug"></div></div>
<button id="searchBtn" class="btn btn-search" style="width:100%;border-radius:16px;padding:14px"><i class="fa-solid fa-magnifying-glass"></i> Search Available Pools • Firebase</button>
<div id="sMsg" style="font-size:11px;color:#666;text-align:center;margin-top:8px"></div>
<div id="poolsBox" style="margin-top:14px"></div>
</div>
<div id="ridesSec" style="display:none"><div class="label">My rides • OTP shows HERE only - driver cannot see it</div><div id="ridesBox"></div><div id="emptyBox" style="text-align:center;padding:30px"><div style="width:56px;height:56px;border-radius:50%;background:#F0FDF4;display:grid;place-items:center;margin:0 auto;color:#10B981"><i class="fa-solid fa-ticket"></i></div><div style="font-weight:800;margin-top:12px">No rides yet</div><div style="font-size:11px;color:#666;margin-top:4px">Search pools and join one.<br>Your OTP will show here only.<br>Driver will ask you for it.</div></div></div>
</div></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, limit, onSnapshot, doc, getDoc, addDoc, updateDoc, getDocs, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyBVIJq5napb_egiLdKhGtySZoPeLUkY9Q4", authDomain: "floot-delivery.firebaseapp.com", projectId: "floot-delivery", storageBucket: "floot-delivery.firebasestorage.app", messagingSenderId: "786230599434", appId: "1:786230599434:web:e1913bd8c2e69a7e1c64f3" };
const appF = initializeApp(firebaseConfig); const db = getFirestore(appF);
let currentCustomer=null, map=null, fromCoord=null, toCoord=null, fromM=null, toM=null, line=null;
let myRides=[], availablePools=[], prevIds=new Set();
const CENTER=[6.5244,3.3792];
const PLACES=[
 {name:"Ketu, Kosofe, Lagos State, 100247, Nigeria",lat:6.6025,lng:3.3882},
 {name:"Onitsha, Anambra State, Nigeria",lat:6.1240,lng:6.7883},
 {name:"Lagos, Lagos Island, Lagos State, 100242, Nigeria",lat:6.4550,lng:3.3840},
 {name:"Alimosho, Lagos State, Nigeria",lat:6.6140,lng:3.2620},
 {name:"Yaba, Lagos",lat:6.5095,lng:3.3711},{name:"Ikeja, Lagos",lat:6.6018,lng:3.3515},{name:"Lekki, Lagos",lat:6.4456,lng:3.4558},
 {name:"Oshodi, Lagos",lat:6.5538,lng:3.3425},{name:"Ikorodu Bus Stop, Lagos",lat:6.6194,lng:3.5081},{name:"CMS, Lagos Island",lat:6.4443,lng:3.3897},
 {name:"Obalende, Lagos",lat:6.4428,lng:3.4036},{name:"Abuja, FCT, Nigeria",lat:9.0765,lng:7.3986}
];
const saved=JSON.parse(localStorage.getItem("floot_customer_session")||"null"); if(saved) loginOK(saved);
function notif(m){ const e=document.getElementById("notif"); document.getElementById("nText").textContent=m; e.classList.add("show"); setTimeout(()=>e.classList.remove("show"),4500); if(navigator.vibrate) navigator.vibrate([100,50,100]); }
function loginOK(c){ currentCustomer=c; document.getElementById("authScreen").style.display="none"; document.getElementById("mainApp").style.display="flex"; document.getElementById("custName").textContent=c.name.split(" ")[0]; document.getElementById("custEmail").textContent=(c.email?c.email.split("@")[0]:"customer")+" • Rider"; document.getElementById("avatar").textContent=(c.name||"C")[0].toUpperCase(); setTimeout(()=>{ initMap(); startListeners(); },500); }
document.getElementById("loginTab").onclick=()=>{ document.getElementById("loginForm").style.display="block"; document.getElementById("regForm").style.display="none"; };
document.getElementById("regTab").onclick=()=>{ document.getElementById("loginForm").style.display="none"; document.getElementById("regForm").style.display="block"; };
document.getElementById("regBtn").onclick=async()=>{ const name=document.getElementById("regName").value.trim(), phone=document.getElementById("regPhone").value.trim(), email=document.getElementById("regEmail").value.trim().toLowerCase(), pass=document.getElementById("regPass").value.trim(), msg=document.getElementById("regMsg"); if(!name||!phone||!email||!pass){msg.textContent="Fill all";return;} const id=email.replace(/[^a-z0-9]/g,"_"); const p={id,name,phone,email,password:pass,role:"customer",createdAt:new Date().toISOString()}; msg.textContent="Creating..."; try{ const ex=await getDoc(doc(db,"customers",id)); if(ex.exists()){msg.textContent="Exists, login";return;} await setDoc(doc(db,"customers",id),p); localStorage.setItem("floot_customer_session",JSON.stringify(p)); loginOK(p);}catch(e){msg.textContent=e.message;} };
document.getElementById("loginBtn").onclick=async()=>{ const email=document.getElementById("loginEmail").value.trim().toLowerCase(), pass=document.getElementById("loginPass").value.trim(), msg=document.getElementById("loginMsg"); if(!email||!pass){msg.textContent="Enter";return;} msg.textContent="Logging..."; try{ const id=email.replace(/[^a-z0-9]/g,"_"); let snap=await getDoc(doc(db,"customers",id)); let prof=snap.exists()?snap.data():null; if(!prof){ const q=query(collection(db,"customers"),where("email","==",email),limit(1)); const qs=await getDocs(q); if(!qs.empty) prof=qs.docs[0].data(); } if(!prof){msg.textContent="No account";return;} if(prof.password!==pass){msg.textContent="Wrong";return;} localStorage.setItem("floot_customer_session",JSON.stringify(prof)); loginOK(prof);}catch(e){msg.textContent=e.message;} };
document.getElementById("logoutBtn").onclick=()=>{ localStorage.removeItem("floot_customer_session"); location.reload(); };
function initMap(){ if(map) return; map=L.map('map',{zoomControl:false,attributionControl:false}).setView(CENTER,10); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map); L.control.zoom({position:'bottomright'}).addTo(map); }
function hav(a,b){ const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180; const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
function attach(id,sid,setter){
 const inp=document.getElementById(id), sug=document.getElementById(sid);
 inp.addEventListener("input",()=>{
  const v=inp.value.trim().toLowerCase(); if(v.length<1){sug.style.display="none";return;}
  let f=PLACES.filter(p=>p.name.toLowerCase().includes(v)).slice(0,6);
  sug.innerHTML=f.map(p=>'<div data-lat="'+p.lat+'" data-lng="'+p.lng+'" data-name="'+p.name+'">'+p.name+'</div>').join("");
  sug.style.display=f.length?"block":"none";
  sug.querySelectorAll("div").forEach(el=>{ el.onclick=()=>{ inp.value=el.getAttribute("data-name"); setter({lat:+el.getAttribute("data-lat"),lng:+el.getAttribute("data-lng")}); sug.style.display="none"; upd(); }; });
  setTimeout(async()=>{ try{ const q=inp.value.trim(); if(q.length<3) return; const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&countrycodes=ng&q='+encodeURIComponent(q)+'&limit=5'); const j=await r.json(); if(j.length>0){ let extra=j.map(o=>'<div data-lat="'+o.lat+'" data-lng="'+o.lon+'" data-name="'+o.display_name+'">'+o.display_name+'</div>').join(""); sug.innerHTML+=extra; sug.style.display="block"; sug.querySelectorAll("div").forEach(el=>{ el.onclick=()=>{ inp.value=el.getAttribute("data-name").split(",").slice(0,3).join(","); setter({lat:+el.getAttribute("data-lat"),lng:+el.getAttribute("data-lng")}); sug.style.display="none"; upd(); }; }); } }catch{} },500);
 });
 document.addEventListener("click",e=>{ if(!sug.contains(e.target)&&e.target!==inp) sug.style.display="none"; });
}
attach("fromI","fromS",c=>fromCoord=c); attach("toI","toS",c=>toCoord=c);
function upd(){ if(!fromCoord||!toCoord) return; if(!map) initMap(); if(fromM) map.removeLayer(fromM); if(toM) map.removeLayer(toM); if(line) map.removeLayer(line); const fI=L.divIcon({html:'<div style="width:12px;height:12px;background:#10B981;border:3px solid #fff;border-radius:50%"></div>',iconSize:[12,12]}); const tI=L.divIcon({html:'<div style="width:12px;height:12px;background:#7C3AED;border:3px solid #fff;border-radius:50%"></div>',iconSize:[12,12]}); fromM=L.marker([fromCoord.lat,fromCoord.lng],{icon:fI}).addTo(map); toM=L.marker([toCoord.lat,toCoord.lng],{icon:tI}).addTo(map); line=L.polyline([[fromCoord.lat,fromCoord.lng],[toCoord.lat,toCoord.lng]],{color:'#10B981',weight:4,dashArray:'8,8'}).addTo(map); map.fitBounds(L.latLngBounds([[fromCoord.lat,fromCoord.lng],[toCoord.lat,toCoord.lng]]),{padding:[80,80]}); }
function setTab(w){ document.getElementById("searchSec").style.display=w=="search"?"block":"none"; document.getElementById("ridesSec").style.display=w=="rides"?"block":"none"; document.getElementById("tSearch").classList.toggle("active",w=="search"); document.getElementById("tRides").classList.toggle("active",w=="rides"); if(map) setTimeout(()=>map.invalidateSize(),200); }
document.getElementById("tSearch").onclick=()=>setTab("search"); document.getElementById("tRides").onclick=()=>setTab("rides");

document.getElementById("searchBtn").onclick=async()=>{
 if(!fromCoord||!toCoord){ document.getElementById("sMsg").textContent="⚠️ Select From & To from dropdown - must click suggestion"; return; }
 const from=document.getElementById("fromI").value.trim(), to=document.getElementById("toI").value.trim();
 document.getElementById("sMsg").textContent="Searching Firebase pool_trips...";
 try{
  const q=query(collection(db,"pool_trips"), where("status","==","open"), limit(20));
  const qs=await getDocs(q);
  availablePools=qs.docs.map(d=>({id:d.id,...d.data()})).filter(p=>{
   // simple filter: show all open pools - customer can join any
   return true;
  });
  if(availablePools.length==0){ document.getElementById("poolsBox").innerHTML='<div style="font-size:12px;color:#666;text-align:center;padding:20px">No open pools now - drivers need to create trip first</div>'; document.getElementById("sMsg").textContent="No pools found - ask driver to create"; return; }
  document.getElementById("poolsBox").innerHTML=availablePools.map(p=>{
   const dist = p.distance?Number(p.distance).toFixed(1):"0";
   const kmToPickup = fromCoord ? hav(fromCoord,{lat:p.fromLat,lng:p.fromLng}).toFixed(1) : "0";
   return `<div class="pool-card" onclick="joinPool('${p.id}')">
    <div style="display:flex;justify-content:space-between"><b style="font-size:13px">🚗 ${p.from.split(",")[0]} → ${p.to.split(",")[0]}</b><span style="font-size:10px;background:#ECFDF5;color:#065F46;padding:4px 8px;border-radius:999px;font-weight:800">${p.totalSeats - (p.joinedCount||0)} seats left</span></div>
    <div style="font-size:11px;color:#666;margin-top:4px">${dist}km • Driver: ${p.driverName||"Driver"} • ${p.vehicle||"Car"} • ₦${(p.totalCollected||0).toLocaleString()} collected</div>
    <div style="font-size:11px;color:#10B981;margin-top:6px"><i class="fa-solid fa-location-dot"></i> ${kmToPickup}km from your pickup • Tap to join</div>
    <div style="margin-top:8px;display:flex;gap:6px"><span style="font-size:10px;background:#F5F3FF;color:#7C3AED;padding:4px 8px;border-radius:999px">₦60 per km • ₦500 base</span></div>
   </div>`;
  }).join("");
  document.getElementById("sMsg").textContent=`Found ${availablePools.length} open pools - tap to join`;
 }catch(e){ document.getElementById("sMsg").textContent="Error: "+e.message; }
};

window.joinPool=async(poolId)=>{
 if(myRides.some(r=> ["searching","pending","accepted","picked_up","on_trip"].includes(r.status))){ notif("You have active ride - complete it first - one ride at a time"); return; }
 const pool=availablePools.find(p=>p.id==poolId); if(!pool){ notif("Pool not found"); return; }
 const from=document.getElementById("fromI").value.trim(), to=document.getElementById("toI").value.trim();
 if(!from||!to||!fromCoord||!toCoord){ notif("Select pickup & destination from dropdown"); return; }
 const dist = hav(fromCoord, toCoord);
 const fare = 500 + Math.round(dist*60);
 const pickupOtp = Math.floor(1000+Math.random()*9000);
 const dropoffOtp = Math.floor(1000+Math.random()*9000);
 const payload={
  poolId:pool.id,
  poolFrom:pool.from,
  poolTo:pool.to,
  driverId:pool.driverId,
  driverName:pool.driverName||"",
  customerId:currentCustomer.id,
  customerName:currentCustomer.name,
  customerPhone:currentCustomer.phone,
  customerEmail:currentCustomer.email||"",
  customerPickup:from,
  customerDropoff:to,

function rideCardHTML(r){
 const isSearching = r.status=="searching"||r.status=="pending";
 const isAccepted = r.status=="accepted";
 const isPicked = r.status=="picked_up"||r.status=="on_trip";
 const isCompleted = r.status=="completed";
 return `<div class="card ${isAccepted||isPicked?'active':''}">
  <div style="display:flex;gap:10px;align-items:center">
    <div style="width:36px;height:36px;border-radius:50%;background:${isCompleted?'#10B981':isAccepted||isPicked?'#7C3AED':'#F5F3FF'};display:grid;place-items:center;color:${isCompleted||isAccepted||isPicked?'#fff':'#7C3AED'};font-weight:900">${(r.driverName||"D")[0].toUpperCase()}</div>
    <div style="flex:1"><div style="font-weight:900;font-size:13px">${r.poolFrom?r.poolFrom.split(",")[0]+" → "+r.poolTo.split(",")[0]:r.customerPickup+" → "+r.customerDropoff}</div><div style="font-size:10px;color:#666">${r.status.toUpperCase()} • Driver: ${r.driverName||"Driver"} • ${r.driverId?r.driverId.slice(0,6):""}</div></div>
    <div style="text-align:right"><div style="font-weight:900;font-size:14px;color:#10B981">₦${(r.fare||0).toLocaleString()}</div></div>
  </div>
  <div style="margin-top:10px;background:#F8F7FF;border-radius:14px;padding:10px">
    <div style="font-size:10px;font-weight:800;color:#888;letter-spacing:.06em">YOUR TRIP</div>
    <div class="route" style="margin-top:8px"><div class="dot green"></div><div class="addr">${r.customerPickup||r.pickup}</div></div>
    <div class="route" style="margin-top:6px"><div class="dot purple"></div><div class="addr">${r.customerDropoff||r.dropoff}</div></div>
    <div style="font-size:11px;color:#666;margin:6px 0 0 20px">${r.distance?Number(r.distance).toFixed(1):"0"}km • Pool: ${r.poolFrom||""} → ${r.poolTo||""}</div>
  </div>
  ${isSearching?`<div style="background:#FEF3C7;border-radius:12px;padding:10px;margin-top:10px;text-align:center"><div style="font-weight:800;font-size:12px;color:#92400E">⏳ Waiting for driver to accept</div><div style="font-size:11px;color:#666;margin-top:4px">Driver sees your name, pickup, destination before acceptance</div></div>`:''}
  ${isAccepted?`<div class="otp-row"><div class="otp-box"><div class="lbl">PICKUP OTP - SHOW TO DRIVER ONLY</div><div class="val">${r.pickupOtp||r.otp}</div><div style="font-size:10px;color:#A78BFA;margin-top:4px">Driver cannot see this - you show it</div></div><div class="collect-box"><div class="lbl">TO PAY</div><div class="val">₦${(r.fare||0).toLocaleString()}</div></div></div>`:''}
  ${isPicked?`<div class="otp-row"><div class="otp-box" style="border-color:#10B981"><div class="lbl">DROP-OFF OTP - SHOW TO DRIVER</div><div class="val">${r.dropoffOtp||r.pickupOtp||r.otp}</div><div style="font-size:10px;color:#A78BFA;margin-top:4px">Show this at dropoff</div></div><div class="collect-box"><div class="lbl">TO PAY</div><div class="val">₦${(r.fare||0).toLocaleString()}</div></div></div>`:''}
  ${isCompleted?`<div style="background:#ECFDF5;border-radius:12px;padding:12px;margin-top:10px;text-align:center"><div style="font-weight:900;color:#065F46">✅ Trip Completed</div><div style="font-size:11px;color:#666;margin-top:4px">Paid ₦${(r.fare||0).toLocaleString()} • Thank you!</div></div>`:''}
  <div class="actions" style="margin-top:10px">
    ${isSearching||isAccepted?`<button onclick="cancelRide('${r.id}')" class="btn btn-cancel"><i class="fa-solid fa-xmark"></i> Cancel - Disappear</button>`:''}
    ${isAccepted||isPicked?`<button onclick="callDriver('${r.driverName||''}')" class="btn btn-call"><i class="fa-solid fa-phone"></i> Call Driver</button>`:''}
  </div>
</div>`;
}

function renderRides(){
 const box=document.getElementById("ridesBox"); const empty=document.getElementById("emptyBox");
 if(myRides.length==0){ box.innerHTML=""; empty.style.display="block"; document.getElementById("cRides").textContent="0"; return; }
 empty.style.display="none";
 box.innerHTML=myRides.map(r=>rideCardHTML(r)).join("");
 document.getElementById("cRides").textContent=myRides.length;
}

function startListeners(){
 if(!currentCustomer) return;
 console.log("Customer listener for:",currentCustomer.id);
 onSnapshot(query(collection(db,"pool_requests"), where("customerId","==",currentCustomer.id), limit(50)), snap=>{
  console.log("Customer pool_requests:",snap.size);
  const all=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0));
  const filtered=all.filter(r=> !r.status.includes("cancel") || r.status=="completed"); // cancelled disappears completely except completed stays
  // Actually for customer: cancelled should disappear completely too
  myRides=all.filter(r=> !r.status.includes("cancel")); // only show non-cancelled, completed stays for history then disappears? Let's keep completed
  // For true disappear: myRides = all.filter(r=> !r.status.includes("cancel") );
  // But keep completed for 1 min then hide? For now show completed
  myRides=all.filter(r=> !r.status.includes("cancel") );
  // If cancelled, it disappears completely - so filtered out
  renderRides();
  // Notify status changes
  const newIds=new Set(snap.docs.map(d=>d.id)); const diff=[...newIds].filter(id=>!prevIds.has(id));
  prevIds=newIds;
 });
}

window.cancelRide=async(id)=>{ if(!confirm("Cancel ride? It will disappear completely from your app")) return; try{ await updateDoc(doc(db,"pool_requests",id),{status:"cancelled_by_customer"}); notif("Cancelled - disappeared from your app"); }catch(e){ notif(e.message); } };
window.callDriver=(n)=>{ notif("Calling driver: "+n); };

setTab("search"); initMap(); renderRides();
</script>
